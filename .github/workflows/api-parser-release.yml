name: API parser release

on:
  push:
    branches: [release/vcard-empty-lines]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-parser-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/skords83/frigg-api:v0.1.0-vcard-empty-lines.20261122.1

jobs:
  validate:
    if: github.repository == 'skords83/frigg' && github.ref == 'refs/heads/release/vcard-empty-lines'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build --workspace=api
      - uses: docker/setup-buildx-action@v3
      - name: Check API Docker build without publishing or starting it
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: false
          load: false

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.repository == 'skords83/frigg' && github.ref == 'refs/heads/release/vcard-empty-lines'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Refuse to overwrite the release tag; fail closed on registry errors
        shell: bash
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE" > /tmp/manifest.out 2> /tmp/manifest.err; then
            echo 'Release tag already exists. Choose a new reviewed version.' >&2
            exit 1
          fi
          if ! grep -Eq 'manifest unknown|: not found' /tmp/manifest.err; then
            cat /tmp/manifest.err >&2
            exit 1
          fi
      - name: Publish API only
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/skords83/frigg
      - name: Record immutable image reference
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          printf 'Image: `%s`\n\nDigest: `ghcr.io/skords83/frigg-api@%s`\n\nCommit: `%s`\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
