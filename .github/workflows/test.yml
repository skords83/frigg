name: Integrity tests
on:
  pull_request:
  push:
    branches-ignore: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build --workspace=api
      - run: npx tsc --noEmit --incremental false -p web/tsconfig.json
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-browser-results
          path: test-results/
          retention-days: 7
      - run: npm run build --workspace=web
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, xml
      - run: bash tests/integration/download-baikal.sh "$RUNNER_TEMP/frigg-baikal-test"
      - run: npm run test:baikal
        env:
          FRIGG_BAIKAL_RELEASE: ${{ runner.temp }}/frigg-baikal-test/baikal
      - name: Install native PostgreSQL test binaries
        run: sudo apt-get update && sudo apt-get install -y postgresql-16 postgresql-contrib
      - name: Native PostgreSQL multiprocess and recovery tests
        run: FRIGG_TEST_PG_BIN=/usr/lib/postgresql/16/bin npm run test:postgres
        env:
          FRIGG_BAIKAL_RELEASE: ${{ runner.temp }}/frigg-baikal-test/baikal
